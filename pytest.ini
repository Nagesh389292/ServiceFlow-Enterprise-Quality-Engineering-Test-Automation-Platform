[pytest]
pythonpath = .
testpaths = automation
markers =
    smoke: Mark test as smoke test
    sanity: Mark test as sanity test
    functional: Mark test as functional test
    regression: Mark test as regression test
    ui: Mark test as UI automation test
    api: Mark test as API automation test
    database: Mark test as Database validation test
    e2e: Mark test as end-to-end cross-layer test
    data_driven: Mark test as data-driven parametrized test
    defect_regression: Mark test as defect regression / re-test
    performance: Mark test as performance / SLA benchmark test
