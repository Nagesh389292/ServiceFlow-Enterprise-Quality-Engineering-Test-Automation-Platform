name: Enterprise Quality Engineering CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHONPATH: .

jobs:
  quality-gate-and-test-execution:
    name: Build, Lint & Automated Test Suites Execution
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eqe_platform
          POSTGRES_USER: eqe_user
          POSTGRES_PASSWORD: eqe_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r application/backend/requirements.txt
          pip install -r automation/requirements.txt

      - name: Launch Application Backend & Frontend Services
        run: |
          PYTHONPATH=application/backend DATABASE_URL="postgresql+asyncpg://eqe_user:eqe_password@localhost:5432/eqe_platform" uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          python -m http.server 3000 --directory application/frontend &
          sleep 5

      - name: Execute API Test Suite (PyTest API)
        run: |
          pytest automation/api/tests/ -m "smoke or functional or regression" --env=ci --html=reports/api_report.html --self-contained-html --json-report --json-report-file=reports/json/results.json

      - name: Execute UI Test Suite (Selenium Headless Chrome)
        run: |
          pytest automation/ui/tests/ -m "smoke or sanity or functional or regression" --env=ci --html=reports/ui_report.html --self-contained-html

      - name: Execute Database Integrity Test Suite
        run: |
          pytest automation/database/ -m "database" --env=ci

      - name: Execute Performance & SLA Test Suite
        run: |
          pytest automation/performance/ -m "performance" --env=ci

      - name: Generate Quality Engineering Dashboard
        if: always()
        run: |
          python reports/dashboard/generate_dashboard.py || true

      - name: Upload Test Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            reports/
            logs/
